<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Mapping - EMSR517; AOI15</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  
  <style>
    /* Set the map container size */
    #map {
      height: 100vh;
      width: 100%;
      min-height: 300px;
      min-width: 100px;
    }
    
    /* ============================================ */
    /* MONOCHROME FILTER */
    /* ============================================ */
    #map.monochrome .leaflet-tile-pane {
      filter: grayscale(100%) contrast(1.2) brightness(0.95);
      -webkit-filter: grayscale(100%) contrast(1.2) brightness(0.95);
    }
    
    /* ============================================ */
    /* SVG EXPORT BUTTON STYLING */
    /* ============================================ */
    .leaflet-control-custom-svg-export {
      background-color: white;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      margin-top: 10px;
    }
    
    .leaflet-control-svg-export-button {
      background-color: white;
      width: 30px;
      height: 30px;
      line-height: 30px;
      display: block;
      text-align: center;
      text-decoration: none;
      color: black;
      font-size: 18px;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .leaflet-control-svg-export-button:hover {
      background-color: #f4f4f4;
    }
    
    /* Custom Layer Control Styling */
    .custom-layer-control {
      background: rgba(255, 255, 255, 0);
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 0px 0px rgba(0,0,0,0.3);
      width: 300px;
      max-height: calc(100vh - 200px); /* Genug Platz für Leaflet Control */
      overflow-y: auto;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      font-size: 12px;
      box-sizing: border-box; /* Padding inbegriffen in width */
    }
    
    .legend-main-header {
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .legend-main-header strong {
      font-size: 15px;
    }
    
    .legend-date-section {
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
    }
    
    .legend-date-header {
      background: #f5f5f5;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #ddd;
      user-select: none;
    }
    
    .legend-date-header:hover {
      background: #e8e8e8;
    }
    
    .section-toggle-icon {
      font-size: 10px;
      min-width: 15px;
      display: inline-block;
    }
    
    .date-header-content {
      flex: 1;
    }
    
    .date-header-content strong {
      font-size: 13px;
      display: block;
      margin-bottom: 2px;
    }
    
    .date-header-content small {
      font-size: 10px;
      color: #666;
    }
    
    .legend-date-content {
      padding: 8px;
    }
    
    .legend-section-compact {
      margin-bottom: 8px;
    }
    
    .legend-category-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 3px 0;
      user-select: none;
    }
    
    .legend-category-compact:hover {
      background: #f0f0f0;
    }
    
    .toggle-icon-small {
      font-size: 9px;
      width: 12px;
      display: inline-block;
    }
    
    .legend-subcategory-compact {
      margin-left: 20px;
      margin-top: 4px;
      padding-left: 8px;
      border-left: 2px solid #ddd;
    }
    
    .legend-item-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      cursor: pointer;
      font-size: 11px;
    }
    
    .legend-item-compact:hover {
      background: #f9f9f9;
    }
    
    .layer-name {
      flex: 1;
      font-size: 11px;
    }
    
    .legend-symbol-small {
      width: 16px;
      height: 12px;
      border-radius: 2px;
      display: inline-block;
    }
    
    .legend-info-compact {
      background: #f5f5f5;
      padding: 6px;
      border-radius: 4px;
      margin-top: 10px;
      text-align: center;
    }
    
    .legend-info-compact small {
      font-size: 10px;
      color: #555;
    }
    
    .custom-layer-control input[type="checkbox"] {
      cursor: pointer;
      width: 14px;
      height: 14px;
    }
    
    .custom-layer-control label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }
    
    /* Leaflet Layer Control Styling (unten links) */
    .leaflet-top.leaflet-left {
      margin-top: 10px;
      margin-left: 10px;
    }
    
    .leaflet-control-layers {
      background: white;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      padding: 8px;
      width: 300px; /* Gleiche Breite wie Custom Layer Control */
    }
    
    .leaflet-control-layers label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      cursor: pointer;
      font-size: 12px;
    }
    
    .leaflet-control-layers input[type="radio"] {
      cursor: pointer;
      width: 14px;
      height: 14px;
      margin: 0;
    }
    
    .leaflet-control-layers-base {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #ddd;
    }
    
    /* Monochrome Filter im Layer Control */
    .leaflet-control-layers-separator {
      height: 0;
      border-top: 1px solid #ddd;
      margin: 8px 0;
    }
    
    /* Zoom Control Styling */
    .leaflet-control-zoom {
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out {
      background: white;
      color: #333;
      font-size: 16px;
      font-weight: bold;
      border: none;
      width: 32px;
      height: 32px;
    }
    
    .leaflet-control-zoom-in:hover,
    .leaflet-control-zoom-out:hover {
      background: #f0f0f0;
    }
    
    /* Custom Layer Control Position - Links oben */
    .leaflet-top.leaflet-left {
      margin-top: 10px;
      margin-left: 10px;
      max-width: 300px; /* Feste Breite */
    }
    
    /* Abstand zwischen Custom Layer Control und Layer Control */
    .leaflet-top.leaflet-left .custom-layer-control {
      margin-bottom: 20px; /* 20px Gap zwischen Controls */
      margin-left: 0; /* Kein zusätzlicher Margin */
    }
    
    /* Leaflet Control exakt ausrichten */
    .leaflet-control-layers {
      margin-left: 10 !important;
      margin-right: 0 !important;
      box-sizing: border-box; /* Padding inbegriffen */
    }
    
    /* Scrollbar für Legende */
    .custom-layer-control::-webkit-scrollbar {
      width: 6px;
    }
    
    .custom-layer-control::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }
    
    .custom-layer-control::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    
    .custom-layer-control::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    /* ============================================ */
    /* ORTSCHAFTEN CONTROL - RECHTE SEITE */
    /* ============================================ */
    
    .ortschaften-control {
      background: rgba(0, 0, 0, 0.741);
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      width: 140px;
      max-height: 400px;
      overflow-y: auto;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
    
    .ortschaften-header {
      border-bottom: 2px solid #ffffff;
      padding-bottom: 8px;
      margin-bottom: 8px;
      text-align: left;
      color: #ffffff;
    }
    
    .ortschaften-header strong {
      font-size: 12px;
    }
    
    .ortschaften-liste {
      display: flex;
      flex-direction: column;
      gap: 1px;
      color: #ffffff;

    }
    
    .ortschaften-item {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      font-size: 11px;
    }
    
    .ortschaften-item:hover {
      background: #47a9bc8e;
      color: #ffffff;
      font-weight: 500;
    }
    
    .ortschaften-control::-webkit-scrollbar {
      width: 6px;
    }
    
    .ortschaften-control::-webkit-scrollbar-track {
      background: #00000070;
      border-radius: 3px;
    }
    
    .ortschaften-control::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    
    .ortschaften-control::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    /* Position rechts oben */
    .leaflet-top.leaflet-right {
      margin-top: 10px;
      margin-right: 10px;
    }
    
    @media (max-width: 768px) {
      #map {
        height: 100vh;
        width: 100vw;
        min-height: 200px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  
  <!-- Zuerst die Daten-Funktionen laden -->
  <script src="RM11.08.21.js"></script>
  <script src="RM19.07.21.js"></script>
  
  <!-- Layer.js für Hochwasserlinie -->
  <script src="Layer.js"></script>
  
  <!-- Ortschaften Control für Navigation -->
  <script src="Ortschaften.js"></script>
  
  <!-- Dann die Hauptanwendung -->
  <script src="app.js"></script>
</body>
</html>
