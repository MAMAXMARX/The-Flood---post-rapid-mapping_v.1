<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapid Mapping - EMSR517; AOI15</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  
  <style>
    /* Set the map container size */
    #map {
      height: 100vh;
      width: 100%;
      min-height: 300px;
      min-width: 100px;
    }
    
    /* ============================================ */
    /* MONOCHROME FILTER */
    /* ============================================ */
    #map.monochrome .leaflet-tile-pane {
      filter: grayscale(100%) contrast(1.2) brightness(0.95);
      -webkit-filter: grayscale(100%) contrast(1.2) brightness(0.95);
    }
    
    /* ============================================ */
    /* SVG EXPORT BUTTON STYLING */
    /* ============================================ */
    .leaflet-control-custom-svg-export {
      background-color: white;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      margin-top: 10px;
    }
    
    .leaflet-control-svg-export-button {
      background-color: white;
      width: 30px;
      height: 30px;
      line-height: 30px;
      display: block;
      text-align: center;
      text-decoration: none;
      color: black;
      font-size: 18px;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .leaflet-control-svg-export-button:hover {
      background-color: #f4f4f4;
    }
    
    /* Custom Layer Control Styling */
    .custom-layer-control {
      background: rgba(0, 0, 0, 0.741); /* Schwarzer Hintergrund wie Ortschaften */
      padding: 0; /* Kein Padding - Headers füllen volle Breite */
      border-radius: 1px; /* Eckig wie Ortschaften */
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 2px solid #ffffff; /* Weißer Rand */
      width: 300px;
      max-height: calc(100vh - 200px); /* Genug Platz für Leaflet Control */
      overflow-y: auto;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      font-size: 12px;
      box-sizing: border-box; /* Padding inbegriffen in width */
    }
    
    /* CEMS Infobox - unterhalb des Custom Layer Controls */
    .cems-infobox {
      background: rgba(0, 0, 0, 0.741);
      padding: 0;
      border-radius: 1px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
      width: 300px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      box-sizing: border-box;
    }
    
    /* Scrollbar für CEMS Infobox */
    .cems-infobox::-webkit-scrollbar {
      width: 8px;
    }
    
    .cems-infobox::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 3px;
    }
    
    .cems-infobox::-webkit-scrollbar-thumb {
      background: #ffffff;
      border-radius: 3px;
    }
    
    .cems-infobox::-webkit-scrollbar-thumb:hover {
      background: #dddddd;
    }
    
    .legend-main-header {
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .legend-main-header strong {
      font-size: 15px;
    }
    
    /* CEMS Infobox - unterhalb des Custom Layer Controls */
    .cems-infobox {
      background: rgba(0, 0, 0, 0.741);
      padding: 0;
      border-radius: 1px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
      width: 300px;
      margin-top: 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      box-sizing: border-box;
    }
    
    .legend-date-section {
      margin-bottom: 0; /* Kein Abstand zwischen Sections */
      border: none; /* Kein Rand um Section */
      border-bottom: 2px solid #ffffff; /* Nur unten weißer Rand als Trenner */
      border-radius: 0; /* Keine runden Ecken */
      overflow: hidden;
      background: rgba(0, 75, 90, 0.557); /* Dunkler Hintergrund */
    }
    
    .legend-date-section:last-child {
      border-bottom: none; /* Letzte Section ohne unteren Rand */
    }
    
    .legend-date-header {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px; /* Padding nur innen */
      margin: 0; /* Kein Margin */
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #ffffff;
      user-select: none;
      color: #ffffff; /* Weiße Schrift */
      width: 100%; /* Volle Breite */
      box-sizing: border-box;
    }
    
    .legend-date-header:hover {
      background: rgba(71, 169, 188, 0.557); /* Cyan Hover wie Ortschaften */
    }
    
    .section-toggle-icon {
      font-size: 10px;
      min-width: 15px;
      display: inline-block;
      color: #ffffff; /* Weiß */
    }
    
    .date-header-content {
      flex: 1;
      color: #ffffff; /* Weiß */
    }
    
    .date-header-content strong {
      font-size: 13px;
      display: block;
      margin-bottom: 2px;
      color: #ffffff;
    }
    
    .date-header-content small {
      font-size: 10px;
      color: #dddddd; /* Hellgrau */
    }
    
    .legend-date-content {
      padding: 12px; /* Padding für Inhalt */
      background: rgba(0, 0, 0, 0.3); /* Halbtransparent schwarz */
    }
    
    .legend-section-compact {
      margin-bottom: 8px;
    }
    
    .legend-category-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 3px 0;
      user-select: none;
      color: #ffffff; /* Weiß */
    }
    
    .legend-category-compact:hover {
      background: rgba(71, 169, 188, 0.3); /* Cyan Hover */
    }
    
    .toggle-icon-small {
      font-size: 9px;
      width: 12px;
      display: inline-block;
      color: #ffffff;
    }
    
    .legend-subcategory-compact {
      margin-left: 20px;
      margin-top: 4px;
      padding-left: 8px;
      border-left: 2px solid #ffffff; /* Weißer Rand */
    }
    
    .legend-item-compact {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 0;
      cursor: pointer;
      font-size: 11px;
      color: #ffffff; /* Weiß */
    }
    
    .legend-item-compact:hover {
      background: rgba(71, 169, 188, 0.3); /* Cyan Hover */
    }
    
    .layer-name {
      flex: 1;
      font-size: 11px;
      color: #ffffff;
    }
    
    .legend-symbol-small {
      width: 16px;
      height: 12px;
      border-radius: 2px;
      display: inline-block;
    }
    
    .legend-info-compact {
      background: rgba(0, 0, 0, 0.5);
      padding: 6px;
      border-radius: 4px;
      margin-top: 10px;
      text-align: center;
      border: 1px solid #ffffff;
    }
    
    .legend-info-compact small {
      font-size: 10px;
      color: #dddddd; /* Hellgrau */
    }
    
    .custom-layer-control input[type="checkbox"] {
      cursor: pointer;
      width: 14px;
      height: 14px;
    }
    
    .custom-layer-control label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
    }
    
    /* Zoom Control Styling */
    .leaflet-control-zoom {
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out {
      background: white;
      color: #333;
      font-size: 16px;
      font-weight: bold;
      border: none;
      width: 32px;
      height: 32px;
    }
    
    .leaflet-control-zoom-in:hover,
    .leaflet-control-zoom-out:hover {
      background: #f0f0f0;
    }
    
    /* Custom Layer Control Position - Links oben */
    .leaflet-top.leaflet-left {
      margin-top: 10px;
      margin-left: 10px;
      max-width: 300px;
    }
    
    /* CEMS Infobox - unterhalb des Custom Layer Controls */
    .cems-infobox {
      background: rgba(0, 0, 0, 0.741);
      padding: 0;
      border-radius: 1px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
      width: 300px;
      margin-top: 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      box-sizing: border-box;
    }
    
    /* Titel Container - Separater Layer ohne Hintergrund/Rahmen */
    .legend-title-container {
      background: transparent;
      padding: 8px 0;
      margin-bottom: 8px;
      border: none;
      box-shadow: none;
      width: 300px;
      font-family: Arial, sans-serif;
    }
    
    /* Custom Layer Control Styling */
    .custom-layer-control::-webkit-scrollbar {
      width: 6px;
    }
    
    .custom-layer-control::-webkit-scrollbar-track {
      background: #00000070; /* Dunkler Track wie Ortschaften */
      border-radius: 3px;
    }
    
    .custom-layer-control::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    
    .custom-layer-control::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    /* ============================================ */
    /* ORTSCHAFTEN CONTROL - RECHTE SEITE */
    /* ============================================ */
    
    .ortschaften-control {
      background: rgba(0, 0, 0, 0.741);
      padding: 0; /* Kein Padding im Container */
      border-radius: 1px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
      width: 140px;
      max-height: 400px;
      overflow: hidden; /* Liste scrollt, Container nicht */
      font-family: Arial, sans-serif;
      font-size: 12px;
      box-sizing: border-box;
    }
    
    .ortschaften-header {
      position: sticky; /* Bleibt oben fixiert beim Scrollen */
      top: 0;
      background: rgba(0, 0, 0, 0.741); /* Gleicher Hintergrund */
      border-bottom: 2px solid #ffffff;
      padding: 8px 12px;
      text-align: left;
      color: #ffffff;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    
    .ortschaften-header:hover {
      background: rgba(71, 169, 188, 0.557); /* Hover-Effekt */
    }
    
    .ortschaften-toggle-icon {
      font-size: 9px;
      font-weight: bold;
      color: #ffffff;
      min-width: 12px;
      transition: transform 0.2s ease;
    }
    
    .ortschaften-header strong {
      font-size: 12px;
      color: #ffffff;
    }
    
    .ortschaften-liste {
      max-height: 340px; /* Platz für Header */
      overflow-y: auto; /* Scrollbar nur in der Liste */
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      color: #ffffff;
      background: #004b5a8e;
    }
    
    .ortschaften-item {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      font-size: 11px;
    }
    
    .ortschaften-item:hover {
      background: #47a9bc8e;
      color: #ffffff;
      font-weight: 500;
    }
    
    .ortschaften-liste::-webkit-scrollbar {
      width: 6px;
    }
    
    .ortschaften-liste::-webkit-scrollbar-track {
      background: #00000070;
      border-radius: 3px;
    }
    
    .ortschaften-liste::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    
    .ortschaften-liste::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    /* Position rechts oben */
    .leaflet-top.leaflet-right {
      margin-top: 10px;
      margin-right: 10px;
    }
    
    /* ============================================ */
    /* BASEMAP CONTROL - RECHTE SEITE */
    /* ============================================ */
    
    .basemap-control {
      background: rgba(0, 0, 0, 0.741);
      padding: 0;
      border-radius: 1px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      border: 2px solid #ffffff;
      width: 140px;
      max-height: 300px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      font-size: 12px;
      box-sizing: border-box;
      margin-bottom: 10px; /* Abstand zu Ortschaften */
    }
    
    .basemap-header {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.741);
      border-bottom: 2px solid #ffffff;
      padding: 8px 12px;
      text-align: left;
      color: #ffffff;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    
    .basemap-header:hover {
      background: rgba(71, 169, 188, 0.557);
    }
    
    .basemap-toggle-icon {
      font-size: 9px;
      font-weight: bold;
      color: #ffffff;
      min-width: 12px;
      transition: transform 0.2s ease;
    }
    
    .basemap-header strong {
      font-size: 12px;
      color: #ffffff;
    }
    
    .basemap-liste {
      max-height: 240px;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      color: #ffffff;
      background: #004b5a8e;
    }
    
    .basemap-item {
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      font-size: 11px;
    }
    
    .basemap-item:hover {
      background: #47a9bc8e;
      color: #ffffff;
      font-weight: 500;
    }
    
    .basemap-item.active {
      background: #47a9bc;
      color: #ffffff;
      font-weight: 600;
    }
    
    .basemap-filter {
      cursor: default !important;
    }
    
    .basemap-filter:hover {
      background: #004b5a8e !important;
      font-weight: normal !important;
    }
    
    .basemap-liste::-webkit-scrollbar {
      width: 6px;
    }
    
    .basemap-liste::-webkit-scrollbar-track {
      background: #00000070;
      border-radius: 3px;
    }
    
    .basemap-liste::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 3px;
    }
    
    .basemap-liste::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    
    @media (max-width: 768px) {
      #map {
        height: 100vh;
        width: 100vw;
        min-height: 200px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  
  <!-- Zuerst die Daten-Funktionen laden -->
  <script src="RM11.08.21.js"></script>
  <script src="RM19.07.21.js"></script>
  
  <!-- Layer.js für Hochwasserlinie -->
  <script src="Layer.js"></script>
  
  <!-- Basemap Control für Kartenauswahl -->
  <script src="BasemapControl.js"></script>
  
  <!-- Ortschaften Control für Navigation -->
  <script src="Ortschaften.js"></script>
  
  <!-- Dann die Hauptanwendung -->
  <script src="app.js"></script>
</body>
</html>
